# Every pull request, and every push to main: the tests, clippy, then the licences of every crate
# Deckhand is built from (packaging/licences.sh). A feature branch is tested
# through its pull request alone; testing its pushes too ran every commit twice.
#
# The job runs in Debian bookworm, as the release builds do. Its image is a Node one because it
# comes with git, which actions/checkout needs to fetch the submodules; Rust is installed on top.
#
# The runner starts empty each time, so the crates and target/ are kept in GitHub's cache by
# rust-cache, and a push compiles what it changed rather than every dependency again.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    env:
      CARGO_TERM_COLOR: always
      # Nothing here is stepped through, so debug info is not worth writing.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          # argosy-sigil, the save library build.rs compiles, and the libraries it vendors.
          submodules: recursive

      - name: Install Rust and the libraries it links
        run: |
          apt-get update -qq
          apt-get install -y -qq libudev-dev pkg-config cmake >/dev/null
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --locked

      - run: cargo clippy --locked --all-targets -- -D warnings

      # Every crate's licence one Deckhand may ship (about.toml), with the notices it needs: what the
      # release build puts in the AppImage, checked here so a dependency that may not be fails its
      # pull request rather than a release.
      - run: packaging/licences.sh target/THIRD-PARTY-LICENSES.md
